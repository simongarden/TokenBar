<g class="face white-upper" data-face="white-upper" clip-path="url(#white-upper-reveal)"><path d="M190.61,410.77l169.03-169.03c19.82-19.82,46.69-30.97,74.7-31l167.81-.19-169.27,169.27c-58.41,58.41-58.45,153.06-.1,211.41h0s-167.55,0-167.55,0c-28.02,0-54.89-11.13-74.7-30.93h0c-41.27-41.27-41.24-108.21.07-149.52Z" fill="#fff"/></g>
<g class="face gray-upper" data-face="gray-upper" clip-path="url(#gray-upper-reveal)"><path d="M602.15,210.54c19.82,0,38.82,7.85,52.83,21.85l63.81,63.78c23.54,23.53,6.85,63.8-26.45,63.82l-239.75.11,149.56-149.56Z" fill="#8391ae"/></g>
<g class="motion pupil-drop"><g class="motion pupil-gaze"><ellipse cx="512" cy="512" rx="49.85" ry="49.81" transform="translate(-212.08 512) rotate(-45)" fill="#8391ae"/></g></g></g>
