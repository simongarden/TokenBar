<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">SKÍRR 動態標誌 v5</title><desc id="desc">圓點由大縮小落下彈跳，以移動遮罩揭露固定原形的白色雙分面，再反向揭露灰藍分面，灰藍色面完成後圓點左移停留，再右移看向另一側，最後回到中央。4.2 秒後回到原稿。</desc>
<style>
.motion { transform-box:view-box; transform-origin:512px 512px; animation-duration:4.2s; animation-fill-mode:both; animation-timing-function:linear; animation-iteration-count:1; }
.pupil-drop { animation-name:pupil-drop; }
.white-upper-mask { animation-name:white-upper-reveal; }
.white-lower-mask { animation-name:white-lower-reveal; }
.gray-upper-mask { animation-name:gray-upper-reveal; }
.gray-lower-mask { animation-name:gray-lower-reveal; }
.face,.face path { transform:none; }
.pupil-gaze { animation-name:pupil-gaze; }
@keyframes pupil-drop {
  0% {opacity:0;transform:translateY(-620px) scale(3.2);}
  1.428571% {opacity:1;transform:translateY(-620px) scale(3.2);animation-timing-function:cubic-bezier(.5,0,.95,.5);}
  13.809524% {opacity:1;transform:translateY(0) scale(1.04,1.10);animation-timing-function:cubic-bezier(.2,.6,.4,1);}
  15.714286% {opacity:1;transform:translateY(24px) scale(1.18,.82);animation-timing-function:cubic-bezier(.2,.8,.3,1);}
  19.523810% {opacity:1;transform:translateY(-58px) scale(.96,1.06);animation-timing-function:cubic-bezier(.5,0,.95,.5);}
  23.333333% {opacity:1;transform:translateY(0) scale(1.08,.94);animation-timing-function:cubic-bezier(.2,.8,.3,1);}
  26.428571% {opacity:1;transform:translateY(-14px) scale(.99,1.02);animation-timing-function:cubic-bezier(.5,0,.95,.5);}
  29.523810%,100% {opacity:1;transform:none;}
}
/* 只移動裁切矩形；四塊色面本身始終維持原路徑、位置與比例。 */
@keyframes white-upper-reveal {
  0%,30.476190% {transform:translateY(592px);animation-timing-function:cubic-bezier(.2,.7,.3,1);}
  48.809524%,100% {transform:translateY(209px);}
}
@keyframes white-lower-reveal {
  0%,30.476190% {transform:translateY(-592px);animation-timing-function:cubic-bezier(.2,.7,.3,1);}
  48.809524%,100% {transform:translateY(-209px);}
}
@keyframes gray-upper-reveal {
  0%,48.809524% {transform:translateY(-815px);animation-timing-function:cubic-bezier(.2,.7,.3,1);}
  66.666667%,100% {transform:translateY(-663px);}
}
@keyframes gray-lower-reveal {
  0%,48.809524% {transform:translateY(815px);animation-timing-function:cubic-bezier(.2,.7,.3,1);}
  66.666667%,100% {transform:translateY(662px);}
}
@keyframes pupil-gaze {
  0%,66.666667% {transform:translateX(0);animation-timing-function:cubic-bezier(.2,.7,.3,1);}
  72.142857%,79.047619% {transform:translateX(-70px);animation-timing-function:cubic-bezier(.45,0,.25,1);}
  88.571429%,92.380952% {transform:translateX(70px);animation-timing-function:cubic-bezier(.2,.7,.3,1);}
  98.095238%,100% {transform:none;}
}
.animated-state { animation:animated-state 4.2s steps(1,end) both; }
.final-state { animation:final-state 4.2s steps(1,end) both; }
@keyframes animated-state { from {opacity:1;} to {opacity:0;} }
@keyframes final-state { from {opacity:0;} to {opacity:1;} }
@media (prefers-reduced-motion:reduce) {
 .motion { animation:none;transform:none;opacity:1; }
 .animated-state { display:none; }
 .final-state { animation:none;opacity:1; }
}
</style>
<defs>
 <clipPath id="white-upper-reveal" clipPathUnits="userSpaceOnUse"><rect class="motion white-upper-mask" width="1024" height="1024"/></clipPath>
 <clipPath id="white-lower-reveal" clipPathUnits="userSpaceOnUse"><rect class="motion white-lower-mask" width="1024" height="1024"/></clipPath>
 <clipPath id="gray-upper-reveal" clipPathUnits="userSpaceOnUse"><rect class="motion gray-upper-mask" width="1024" height="1024"/></clipPath>
 <clipPath id="gray-lower-reveal" clipPathUnits="userSpaceOnUse"><rect class="motion gray-lower-mask" width="1024" height="1024"/></clipPath>
</defs>
