name: OKM Skirr
options:
  bundleIdPrefix: com.okmaster
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.2.5"
    CURRENT_PROJECT_VERSION: "11"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  OKM Skirr:
    productName: OKM-Skirr
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: OKM Skirr
        CFBundleName: OKM Skirr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Simon Wang"
        # Sparkle: appcast.xml is attached to every GitHub Release; "latest" always points at the newest one.
        SUFeedURL: https://github.com/simongarden/TokenBar/releases/latest/download/appcast.xml
        SUPublicEDKey: 5beeNKkNlYN1xr0eE8ij4dvDwdzaQoO+Sk8puvg+gxc=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okmaster.TokenBar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: OKM-Skirr
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets: [OKMSkirrTests]
  OKMSkirrTests:
    type: bundle.unit-test
    platform: macOS
    # Not hosted in the app (that would launch the menu bar item); compiles the tested sources directly.
    sources:
      - Tests
      - Sources/Models.swift
      - Sources/UsageScanner.swift
      - Sources/StatusImageRenderer.swift
      - Sources/ClaudeConnectionPresentation.swift
      - Sources/ClaudeUsageClient.swift
      - Sources/RecentFileWatcher.swift
      - Sources/ClaudeCLI.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okmaster.TokenBarTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
